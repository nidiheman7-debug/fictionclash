<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="skullGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f2ede4"/>
      <stop offset="70%" stop-color="#cdc4b4"/>
      <stop offset="100%" stop-color="#948a78"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a2a"/>
      <stop offset="60%" stop-color="#b30f0f"/>
      <stop offset="100%" stop-color="#5c0808"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- cranium -->
  <path d="M32 4
           C 46 4 54 15 54 27
           C 54 34 51 38 49 41
           L 49 47
           C 49 50 47 51 45 51
           L 41 51
           C 40 51 39 52 39 53
           L 39 57
           C 39 59 37.5 60 36 60
           L 28 60
           C 26.5 60 25 59 25 57
           L 25 53
           C 25 52 24 51 23 51
           L 19 51
           C 17 51 15 50 15 47
           L 15 41
           C 13 38 10 34 10 27
           C 10 15 18 4 32 4 Z"
        fill="url(#skullGrad)" stroke="#5c5344" stroke-width="1"/>

  <!-- eye sockets with glow -->
  <ellipse cx="23" cy="27" rx="7" ry="8" fill="#241f1a"/>
  <ellipse cx="41" cy="27" rx="7" ry="8" fill="#241f1a"/>
  <circle cx="23" cy="27" r="4" fill="url(#eyeGlow)" filter="url(#glow)"/>
  <circle cx="41" cy="27" r="4" fill="url(#eyeGlow)" filter="url(#glow)"/>

  <!-- nasal cavity -->
  <path d="M32 33 L28 40 L36 40 Z" fill="#241f1a"/>

  <!-- teeth -->
  <g fill="#f2ede4" stroke="#5c5344" stroke-width="0.6">
    <rect x="19" y="51" width="5" height="7" rx="1"/>
    <rect x="24.5" y="51" width="5" height="8" rx="1"/>
    <rect x="30" y="51" width="4" height="8.5" rx="1"/>
    <rect x="34.5" y="51" width="4" height="8" rx="1"/>
    <rect x="39" y="51" width="5" height="7" rx="1"/>
  </g>

  <!-- cracks -->
  <path d="M46 14 L43 20 L46 24" stroke="#5c5344" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M14 20 L17 24" stroke="#5c5344" stroke-width="0.8" fill="none" opacity="0.7"/>
</svg>
